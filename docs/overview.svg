<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>maskera: how it works</title>
  <desc>Three-step overview: your text contains sensitive personal data, maskera replaces it on your device, and the AI service only sees placeholders. The reply gets the real details back on your side.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#8f8f8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="690" fill="#ffffff"/>

  <!-- Header -->
  <text x="48" y="64" font-size="26" font-weight="700" fill="#000000">maskera</text>
  <text x="48" y="94" font-size="16" fill="#666666">Personal data stays with you, before your text reaches AI services, logs, or analytics.</text>

  <!-- ============ Card 1: Din text ============ -->
  <rect x="48" y="132" width="340" height="330" rx="10" fill="#ffffff" stroke="#eaeaea" stroke-width="1.5"/>
  <circle cx="82" cy="166" r="13" fill="#000000"/>
  <text x="82" y="171" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="104" y="171" font-size="16.5" font-weight="650" fill="#000000">Your text</text>
  <text x="72" y="196" font-size="12.2" fill="#666666">contains sensitive personal data</text>

  <rect x="68" y="212" width="300" height="140" rx="8" fill="#fafafa" stroke="#eaeaea"/>
  <!-- highlight: Anna Lindqvist (NAMN, demoblå) -->
  <rect x="198" y="225" width="115.2" height="21" rx="5" fill="#1d4ed8" fill-opacity="0.12"/>
  <line x1="201" y1="244" x2="310.2" y2="244" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round"/>
  <!-- highlight: 991201-2391 (PERSONNUMMER, demoröd) -->
  <rect x="81" y="277" width="91.8" height="21" rx="5" fill="#b91c1c" fill-opacity="0.12"/>
  <line x1="84" y1="296" x2="169.8" y2="296" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/>
  <!-- highlight: 070-174 06 58 (TELEFON, demoteal) -->
  <rect x="135.6" y="303" width="107.4" height="21" rx="5" fill="#115e59" fill-opacity="0.12"/>
  <line x1="138.6" y1="322" x2="240" y2="322" stroke="#115e59" stroke-width="2" stroke-linecap="round"/>

  <g font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">
    <text x="84" y="240" textLength="109.2" lengthAdjust="spacingAndGlyphs">Hej! Jag heter</text>
    <text x="201" y="240" textLength="109.2" lengthAdjust="spacingAndGlyphs" font-weight="600">Anna Lindqvist</text>
    <text x="310.2" y="240" textLength="7.8" lengthAdjust="spacingAndGlyphs">.</text>
    <text x="84" y="266" textLength="156" lengthAdjust="spacingAndGlyphs">Mitt personnummer är</text>
    <text x="84" y="292" textLength="85.8" lengthAdjust="spacingAndGlyphs" font-weight="600">991201-2391</text>
    <text x="177.6" y="292" textLength="78" lengthAdjust="spacingAndGlyphs">och ni når</text>
    <text x="84" y="318" textLength="46.8" lengthAdjust="spacingAndGlyphs">mig på</text>
    <text x="138.6" y="318" textLength="101.4" lengthAdjust="spacingAndGlyphs" font-weight="600">070-174 06 58</text>
    <text x="240" y="318" textLength="7.8" lengthAdjust="spacingAndGlyphs">.</text>
  </g>

  <rect x="84" y="370" width="14" height="10" rx="2.5" fill="#1d4ed8" fill-opacity="0.12"/>
  <line x1="85" y1="382" x2="97" y2="382" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round"/>
  <rect x="102" y="370" width="14" height="10" rx="2.5" fill="#b91c1c" fill-opacity="0.12"/>
  <line x1="103" y1="382" x2="115" y2="382" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/>
  <rect x="120" y="370" width="14" height="10" rx="2.5" fill="#115e59" fill-opacity="0.12"/>
  <line x1="121" y1="382" x2="133" y2="382" stroke="#115e59" stroke-width="2" stroke-linecap="round"/>
  <text x="142" y="380" font-size="12" fill="#666666">= sensitive detail, one color per type</text>

  <!-- ============ Card 2: maskera ============ -->
  <rect x="430" y="132" width="340" height="330" rx="10" fill="#ffffff" stroke="#eaeaea" stroke-width="1.5"/>
  <circle cx="464" cy="166" r="13" fill="#000000"/>
  <text x="464" y="171" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="486" y="171" font-size="16.5" font-weight="650" fill="#000000">maskera replaces it</text>
  <text x="454" y="196" font-size="12.2" fill="#666666">two layers working together, on your device</text>

  <rect x="454" y="212" width="292" height="34" rx="17" fill="#000000"/>
  <path d="M 466 229 v -4 a 5 5 0 0 1 10 0 v 4" fill="none" stroke="#ffffff" stroke-width="1.7"/>
  <rect x="463.5" y="229" width="15" height="10" rx="2" fill="#ffffff"/>
  <text x="614" y="234" font-size="12.3" font-weight="600" fill="#ffffff" text-anchor="middle">Runs on your device, nothing leaves it</text>

  <text x="454" y="281" font-size="14" font-weight="650" fill="#000000">Rules</text>
  <text x="454" y="302" font-size="12.4" fill="#555555">catch everything with an exact shape:</text>
  <text x="454" y="320" font-size="12.4" fill="#555555">personnummer, phone, cards, IBAN …</text>

  <line x1="454" y1="340" x2="746" y2="340" stroke="#eeeeee" stroke-width="1.5"/>

  <text x="454" y="368" font-size="14" font-weight="650" fill="#000000">AI model</text>
  <text x="454" y="389" font-size="12.4" fill="#555555">catches names, places, companies and</text>
  <text x="454" y="407" font-size="12.4" fill="#555555">addresses. A small Swedish model (43 MB)</text>
  <text x="454" y="425" font-size="12.4" fill="#555555">that runs right in the browser.</text>

  <!-- ============ Card 3: Det som skickas vidare ============ -->
  <rect x="812" y="132" width="340" height="330" rx="10" fill="#ffffff" stroke="#eaeaea" stroke-width="1.5"/>
  <circle cx="846" cy="166" r="13" fill="#000000"/>
  <text x="846" y="171" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="868" y="171" font-size="16.5" font-weight="650" fill="#000000">What gets sent onward</text>
  <text x="836" y="196" font-size="12.2" fill="#666666">the receiver only sees placeholders</text>

  <rect x="832" y="212" width="300" height="140" rx="8" fill="#fafafa" stroke="#eaeaea"/>
  <!-- chip: [NAMN] (demoblå) -->
  <rect x="962" y="225" width="52.8" height="21" rx="5" fill="#1d4ed8" fill-opacity="0.07" stroke="#1d4ed8" stroke-opacity="0.35"/>
  <!-- chip: [PERSONNUMMER] (demoröd) -->
  <rect x="845" y="277" width="115.2" height="21" rx="5" fill="#b91c1c" fill-opacity="0.07" stroke="#b91c1c" stroke-opacity="0.35"/>
  <!-- chip: [TELEFON] (demoteal) -->
  <rect x="899.6" y="303" width="76.2" height="21" rx="5" fill="#115e59" fill-opacity="0.07" stroke="#115e59" stroke-opacity="0.35"/>

  <g font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">
    <text x="848" y="240" textLength="109.2" lengthAdjust="spacingAndGlyphs">Hej! Jag heter</text>
    <text x="965" y="240" textLength="46.8" lengthAdjust="spacingAndGlyphs" font-weight="650" fill="#1d4ed8">[NAMN]</text>
    <text x="1011.8" y="240" textLength="7.8" lengthAdjust="spacingAndGlyphs">.</text>
    <text x="848" y="266" textLength="156" lengthAdjust="spacingAndGlyphs">Mitt personnummer är</text>
    <text x="848" y="292" textLength="109.2" lengthAdjust="spacingAndGlyphs" font-weight="650" fill="#b91c1c">[PERSONNUMMER]</text>
    <text x="965" y="292" textLength="78" lengthAdjust="spacingAndGlyphs">och ni når</text>
    <text x="848" y="318" textLength="46.8" lengthAdjust="spacingAndGlyphs">mig på</text>
    <text x="902.6" y="318" textLength="70.2" lengthAdjust="spacingAndGlyphs" font-weight="650" fill="#115e59">[TELEFON]</text>
    <text x="972.8" y="318" textLength="7.8" lengthAdjust="spacingAndGlyphs">.</text>
  </g>

  <rect x="848" y="370" width="14" height="10" rx="2.5" fill="#1d4ed8" fill-opacity="0.07" stroke="#1d4ed8" stroke-opacity="0.35"/>
  <rect x="866" y="370" width="14" height="10" rx="2.5" fill="#b91c1c" fill-opacity="0.07" stroke="#b91c1c" stroke-opacity="0.35"/>
  <rect x="884" y="370" width="14" height="10" rx="2.5" fill="#115e59" fill-opacity="0.07" stroke="#115e59" stroke-opacity="0.35"/>
  <text x="906" y="380" font-size="12" fill="#666666">= placeholder, one color per type</text>
  <text x="848" y="400" font-size="12" fill="#666666">the original never leaves your device</text>

  <!-- Arrows between cards -->
  <line x1="394" y1="297" x2="420" y2="297" stroke="#8f8f8f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="776" y1="297" x2="802" y2="297" stroke="#8f8f8f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Return path -->
  <path d="M 982 468 V 512 H 218 V 478" fill="none" stroke="#b0b0b0" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="600" y="504" font-size="13" fill="#444444" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="8">And the reply? maskera puts the real details back, only you see the original.</text>

  <!-- Fact chips -->
  <rect x="164" y="560" width="262" height="36" rx="18" fill="#fafafa" stroke="#eaeaea"/>
  <text x="295" y="582" font-size="12.4" fill="#1a1a1a" text-anchor="middle">Fully local, works offline too</text>
  <rect x="450" y="560" width="312" height="36" rx="18" fill="#fafafa" stroke="#eaeaea"/>
  <text x="606" y="582" font-size="12.4" fill="#1a1a1a" text-anchor="middle">Open source, every number published</text>
  <rect x="786" y="560" width="250" height="36" rx="18" fill="#fafafa" stroke="#eaeaea"/>
  <text x="911" y="582" font-size="12.4" fill="#1a1a1a" text-anchor="middle">Built for Swedish personal data</text>

  <!-- Footer -->
  <text x="600" y="650" font-size="12.5" fill="#999999" text-anchor="middle">https://maskera.dev</text>
</svg>
