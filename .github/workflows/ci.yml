name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repo; checkout and the Hub download are all the
# token is for. Set explicitly so the job never inherits a read/write default.
permissions:
  contents: read

jobs:
  # Lint + build + unit tests across the supported Node range, then a pack
  # smoke: install the actual tarballs into a fresh project and exercise the
  # ESM and CJS entry points (catches exports-map/bundling breakage that
  # src-importing unit tests can't see).
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v5
      # pnpm version comes from the "packageManager" field in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Benchmark contract and carriers are synchronized
        run: pnpm check:benchmarks
        if: matrix.node == 24
      - run: pnpm lint
        if: matrix.node == 24
      - run: pnpm build
      # A mocked Worker cannot catch a missing or incompatible ONNX runtime.
      # Load the real production bundle + model in Chromium and WebKit.
      - name: Install demo smoke browsers
        if: matrix.node == 24
        run: pnpm --filter @maskera/demo exec playwright install --with-deps chromium webkit
      - name: Smoke-test the browser AI model
        if: matrix.node == 24
        run: pnpm --filter @maskera/demo test:model
      - name: Audit demo accessibility
        if: matrix.node == 24
        run: pnpm --filter @maskera/demo audit:a11y
      # After build: ner/demo typecheck against @maskera/core's emitted
      # dist/*.d.ts, which only exists once build has run.
      - run: pnpm typecheck
        if: matrix.node == 24
      - run: pnpm test
      - run: pnpm smoke

  # The public packages declare Node >=18. Keep the minimum-version contract
  # honest without forcing Vite's newer build tooling to support Node 18 too:
  # build and exercise only the two published package tarballs here.
  package-node18:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 18
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @maskera/core --filter maskera
      - run: pnpm --filter @maskera/core --filter maskera build
      - run: pnpm smoke

  # Reproduce the complete published v19 snapshot against the checksum-pinned
  # local model. Every aggregate must match the release contract exactly; the
  # individual runners retain their safety floors as an additional guard.
  model-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @maskera/core --filter maskera build
      - name: Fetch the checksum-pinned local model
        run: node apps/demo/scripts/fetch-model.mjs
      - name: Model artifact matches the published benchmark contract
        run: MASKERA_REQUIRE_MODEL=1 pnpm check:benchmarks
      - name: Reproduce every published v19 metric exactly
        env:
          MASKERA_RELEASE_RESULT_DIR: tmp/release-benchmark-results
        run: pnpm eval:release
      - name: Upload benchmark reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reproduction-${{ github.sha }}
          path: tmp/release-benchmark-results/*.json
          if-no-files-found: error
          retention-days: 90
