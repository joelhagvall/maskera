name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repo; checkout and the Hub download are all the
# token is for. Set explicitly so the job never inherits a read/write default.
permissions:
  contents: read

jobs:
  # Lint + build + unit tests across the supported Node range, then a pack
  # smoke: install the actual tarballs into a fresh project and exercise the
  # ESM and CJS entry points (catches exports-map/bundling breakage that
  # src-importing unit tests can't see).
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v7
      # pnpm version comes from the "packageManager" field in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
        if: matrix.node == 24
      - run: pnpm build
      # A mocked Worker cannot catch a missing or incompatible ONNX runtime.
      # Load the real production bundle + model in Chromium and WebKit.
      - name: Install demo smoke browsers
        if: matrix.node == 24
        run: pnpm --filter @maskera/demo exec playwright install --with-deps chromium webkit
      - name: Smoke-test the browser AI model
        if: matrix.node == 24
        run: pnpm --filter @maskera/demo test:model
      - name: Audit demo accessibility
        if: matrix.node == 24
        run: pnpm --filter @maskera/demo audit:a11y
      # After build: ner/demo typecheck against @maskera/core's emitted
      # dist/*.d.ts, which only exists once build has run.
      - run: pnpm typecheck
        if: matrix.node == 24
      - run: pnpm test
      - run: pnpm smoke

  # The public packages declare Node >=18. Keep the minimum-version contract
  # honest without forcing Vite's newer build tooling to support Node 18 too:
  # build and exercise only the two published package tarballs here.
  package-node18:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 18
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @maskera/core --filter maskera
      - run: pnpm --filter @maskera/core --filter maskera build
      - run: pnpm smoke

  # Grade the published Swedish NER model against the gold corpus and gate on
  # a span-F1 floor plus a leak-rate ceiling (missed entities are the safety
  # metric for a redaction tool). Downloads ~40 MB from the HF Hub.
  #
  # No MASKERA_REVISION here on purpose: this grades the sha the package pins,
  # which is what consumers download. The weekly canary grades `main` instead,
  # so a bad Hub upload still surfaces somewhere.
  model-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @maskera/core --filter maskera build
      - name: Run gold-corpus eval against the Hub model
        working-directory: packages/ner
        shell: bash
        env:
          MASKERA_REMOTE: "1"
          MASKERA_DTYPE: q4
          MASKERA_F1_FLOOR: "0.90"
          MASKERA_LEAK_CEIL: "0.08"
        run: |
          # One retry for transient Hub/network failures; a second identical
          # failure is treated as real.
          node eval/run-eval.mjs | tee "$GITHUB_STEP_SUMMARY" || \
            (echo "retrying once after 30s..." && sleep 30 && \
             node eval/run-eval.mjs | tee "$GITHUB_STEP_SUMMARY")
      - name: Fetch the checksum-pinned local model
        run: node apps/demo/scripts/fetch-model.mjs
      - name: Run general domain regression gate
        run: pnpm eval:domain
      - name: Run clinical domain regression gate
        run: pnpm eval:domain:clinical
