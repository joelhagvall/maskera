name: Benchmark sync canary

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  deployment_status:

permissions:
  contents: read
  issues: write

concurrency:
  group: benchmark-canary-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install benchmark verifier dependency
        run: pnpm install --frozen-lockfile --filter maskera-monorepo --ignore-scripts
      - name: Verify repository carriers
        run: pnpm check:benchmarks
      - name: Verify npm, Hugging Face, GitHub and both deployed sites
        env:
          MASKERA_GITHUB_REVISION: ${{ github.event.deployment.sha || github.sha }}
        run: node scripts/check-benchmark-live.mjs --all
      - name: Open or update a benchmark-drift issue
        if: failure() && github.event_name != 'deployment_status'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Benchmark sync canary failed"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="The benchmark contract no longer matches npm, Hugging Face, GitHub or one of the deployed sites. No benchmark claim should be released or deployed until this is resolved.\n\nRun: $run_url"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
