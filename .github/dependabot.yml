# Weekly, grouped dependency PRs. CI (unit tests, pack smoke, model eval)
# gates every PR, so a green Dependabot PR is safe to merge on sight, and the
# nightly model canary catches anything that only breaks against the live Hub.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
      dependencies:
        dependency-type: production
    ignore:
      # tsup's dts step (rollup-plugin-dts) needs the TS 5 JS compiler API;
      # TS 7+ is the native rewrite and breaks the build. TS 7 is tracked
      # separately via the typescript-7 alias for `pnpm typecheck`.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
