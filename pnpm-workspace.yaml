packages:
  - "packages/*"
  - "apps/*"
  - "examples"

# adm-zip and sharp sit inside the @huggingface/transformers closure that the
# benchmark contract's evaluation.environment checksum freezes, so bumping them
# would change the frozen release environment for code that never runs:
# - adm-zip <=0.6.0 (GHSA-7q85-xj36-vmfc, GHSA-rcw4-f5rp-g42v,
#   GHSA-j5f4-cc29-5x44, GHSA-8238-w5pm-2374) is only used by
#   onnxruntime-node's install script, which is not in onlyBuiltDependencies
#   and therefore never executes.
# - sharp <0.35.4 (GHSA-rgj7-g3m4-5g8c, bundled libheif) only matters when
#   decoding HEIF images; Maskera is text-only NER and never loads an image.
# Drop these when the next model/benchmark release moves the environment
# checksum anyway; bump the adm-zip and sharp overrides at the same time.
# Dependabot gates the parent Biome release by age. Its exact-version native
# children must remain installable when the parent passes that gate, even if
# their publication timestamps differ. This does not exempt @biomejs/biome.
minimumReleaseAgeExclude:
  - "@biomejs/cli-*"

# GHSA-vfj7-8cjw-p6xm has no patched braces version. All braces paths are
# development-only under Changesets (micromatch/fast-glob): patterns come from
# the reviewed .changeset/config.json and pnpm-workspace.yaml, never from API,
# browser or customer input. Remove this exception when upstream ships a fix.
auditConfig:
  ignoreGhsas:
    - GHSA-7q85-xj36-vmfc
    - GHSA-rcw4-f5rp-g42v
    - GHSA-j5f4-cc29-5x44
    - GHSA-8238-w5pm-2374
    - GHSA-rgj7-g3m4-5g8c
    - GHSA-vfj7-8cjw-p6xm
